<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Image Generator</title>
    <style>
        :root {
            --bg: #0a0a0b;
            --panel: #131315;
            --panel-2: #1a1a1d;
            --border: #26262b;
            --text: #f2f2f3;
            --muted: #8a8a93;
            --accent: #c8ff2e;          /* 네온 라임 그린 */
            --accent-dim: rgba(200, 255, 46, 0.14);
            --accent-glow: rgba(200, 255, 46, 0.35);
            --on-accent: #0a0a0b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(900px 500px at 85% -10%, rgba(200, 255, 46, 0.08), transparent 60%),
                radial-gradient(700px 400px at -10% 110%, rgba(200, 255, 46, 0.05), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- 상단 바 ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: rgba(10, 10, 11, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: -0.02em;
        }
        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel);
            font-size: 12px;
            color: var(--muted);
        }
        .status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* ---------- 본문 ---------- */
        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 16px 64px;
        }

        .hero { margin-bottom: 36px; }
        .eyebrow {
            display: inline-block;
            margin-bottom: 14px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .hero h1 {
            margin: 0 0 10px;
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.04em;
        }
        .hero h1 span { color: var(--accent); }
        .hero p { margin: 0; color: var(--muted); font-size: 15px; }

        .grid {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px;
        }
        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 18px;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* ---------- 입력 ---------- */
        .field { margin-bottom: 16px; }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .tag {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }
        .tag-pos { background: var(--accent-dim); color: var(--accent); }
        .tag-neg { background: rgba(255, 90, 90, 0.12); color: #ff7a7a; }

        textarea {
            width: 100%;
            resize: vertical;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font: inherit;
            font-size: 14px;
            transition: border-color .15s, box-shadow .15s;
        }
        textarea::placeholder { color: #5a5a62; }
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        /* ---------- 버튼 ---------- */
        button {
            width: 100%;
            margin-top: 6px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 28px -8px var(--accent-glow);
            transition: transform .1s, box-shadow .2s, filter .2s;
        }
        button:hover {
            filter: brightness(1.05);
            box-shadow: 0 10px 36px -6px var(--accent-glow);
        }
        button:active { transform: scale(.98); }
        button:disabled { cursor: wait; filter: saturate(.6) brightness(.85); }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(10, 10, 11, .25);
            border-top-color: var(--on-accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            display: none;
        }
        .loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- 결과 ---------- */
        .result-box {
            position: relative;
            aspect-ratio: 1 / 1;
            max-height: 72vh;
            margin: 0 auto;
            border-radius: 16px;
            border: 1px dashed var(--border);
            background:
                linear-gradient(var(--panel-2), var(--panel-2)) padding-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            overflow: hidden;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            padding: 16px;
        }
        .empty-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 22px;
        }
        .result-box.has-image {
            border: 1px solid var(--border);
            padding: 0;
            background: #000;
        }
        .result-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .result-box.generating::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 30%, rgba(200, 255, 46, 0.08) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmer 1.6s linear infinite;
        }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        .result-actions {
            margin-top: 14px;
            display: flex;
            justify-content: flex-end;
        }
        .result-actions a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: border-color .15s, color .15s;
        }
        .result-actions a:hover { border-color: var(--accent); color: var(--accent); }

        .prompt-chip {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
            overflow-wrap: anywhere;
        }
        .prompt-chip b { color: var(--text); font-weight: 600; }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="brand"><span class="brand-dot"></span>ComfyUI Studio</div>
        <div class="status">SDXL Turbo</div>
    </nav>

    <main class="wrap">
        <section class="hero">
            <span class="eyebrow">Text to Image</span>
            <h1>상상을 <span>이미지</span>로</h1>
            <p>프롬프트를 입력하고 Generate를 누르면 ComfyUI가 이미지를 생성합니다.</p>
        </section>

        <div class="grid">
            <form class="panel" method="post" id="gen-form">
                <div class="panel-title">Prompt</div>
                <div class="field">
                    <label for="pos"><span class="tag tag-pos">+</span>Positive</label>
                    <textarea id="pos" name="pos" rows="6" placeholder="생성하고 싶은 장면을 자세히 설명하세요">{{pos}}</textarea>
                </div>
                <div class="field">
                    <label for="neg"><span class="tag tag-neg">−</span>Negative</label>
                    <textarea id="neg" name="neg" rows="3" placeholder="제외하고 싶은 요소">{{neg}}</textarea>
                </div>
                <button type="submit" id="gen-btn">
                    <span class="spinner"></span>
                    <span class="btn-text">Generate ✦</span>
                </button>
            </form>

            <section class="panel">
                <div class="panel-title">Result</div>
                <div class="result-box {% if img_url %}has-image{% endif %}" id="result-box">
                    {% if img_url %}
                        <img src="{{img_url}}" alt="생성된 이미지">
                    {% else %}
                        <div class="empty-icon">✦</div>
                        <div>아직 생성된 이미지가 없습니다.</div>
                    {% endif %}
                </div>
                {% if img_url %}
                <div class="prompt-chip"><b>Prompt</b> · {{pos}}</div>
                <div class="result-actions">
                    <a href="{{img_url}}" target="_blank" rel="noopener">원본 크기로 보기 ↗</a>
                </div>
                {% endif %}
            </section>
        </div>
    </main>

    <script>
        document.getElementById("gen-form").addEventListener("submit", function () {
            var btn = document.getElementById("gen-btn");
            btn.classList.add("loading");
            btn.disabled = true;
            btn.querySelector(".btn-text").textContent = "생성 중...";

            var box = document.getElementById("result-box");
            box.classList.remove("has-image");
            box.classList.add("generating");
            box.innerHTML = '<div class="empty-icon">✦</div><div>이미지를 생성하고 있습니다...</div>';
        });
    </script>
</body>
</html>
